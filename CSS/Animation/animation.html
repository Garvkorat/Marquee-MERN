<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Square Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        .main {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; 
        }

        #box {
            height: 300px;
            width: 300px;
            background-color: #0ea5e9;
           
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-weight: bold;
            color: white;
            border-radius: 12px; 
           
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);

    
            animation: smoothSquare 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        @keyframes smoothSquare {
            0% {
                transform: translate(0, 0);
                background-color: #0ea5e9;
                box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
            }
            25% {
                transform: translate(150px, 0);
                background-color: #6366f1; 
                box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            }
            50% {
                transform: translate(150px, 150px); 
                background-color: #d946ef; 
                box-shadow: 0 10px 25px rgba(217, 70, 239, 0.4);
            }
            75% {
                transform: translate(0, 150px);
                background-color: #f43f5e;
                box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
            }
            100% {
                transform: translate(0, 0); 
                background-color: #0ea5e9;
                box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
            }
        }

    </style>
</head>
<body>
    <div class="main">
        <div id="box">Garv Korat</div>
    </div>
</body>
</html>
