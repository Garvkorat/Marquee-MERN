<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="Blink.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="profile-img">
            <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1irakm2XKD0xniYh-97QAtfcJURglitNMCA&s>
            <div class="green-dot"></div>
        </div>

        <div class="content">

            <h2>Shinchan</h2>
            <p class="job">Web Developer</p>

            <div class="stats">

                <div class="stat">
                    <h3>100</h3>
                    <span>Posts</span>
                </div>

                <div class="stat">
                    <h3>710k</h3>
                    <span>Followers</span>
                </div>

                <div class="stat">
                    <h3>185</h3>
                    <span>Following</span>
                </div>

            </div>

            <div class="buttons">
                <button class="follow">Follow</button>
                <button class="message">Message</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
