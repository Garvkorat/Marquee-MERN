<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Layout</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #4982b1;
            --blue-light: #2a79c8;
            --border: rgba(255, 255, 255, 0.45);
            --text: #ffffff;
            --font: 'Segoe UI', sans-serif;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: #f0f0f0;
        }

        .page {
            display: grid;
            height: 100vh;
            grid-template-rows: 90px 1fr 50px;
            grid-template-columns: 110px 1fr 130px;
            grid-template-areas:
                "header  header  header"
                "nav     content sidebar"
                "nav     footer  sidebar";
        }

        .section {
            background: var(--blue);
            color: var(--text);
            font-size: 14px;
            padding: 10px 14px;
        }

        .header {
            grid-area: header;
            border-bottom: 1px solid var(--border);
        }

        .nav {
            grid-area: nav;
            border-right: 1px solid var(--border);
        }

        .content {
            grid-area: content;
        }

        .sidebar {
            grid-area: sidebar;
            border-left: 1px solid var(--border);
        }

        .footer {
            grid-area: footer;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="section header">Header</div>
        <div class="section nav">Navigation</div>
        <div class="section content">Content</div>
        <div class="section sidebar">Sidebar</div>
        <div class="section footer">Footer</div>
    </div>
</body>

</html>
