<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMl Table</title>
    <style>
        table,
        td,
        th,
        tr{
            border: 1px solid;
            border-color: black;
            border-style: solid;
            border-collapse: collapse;

        }
        thead{
            background-color: rgb(86, 135, 135);
        }
        
    </style>
</head>
<body>
    <table>
       <p><b>Student Information:</b></p>
        <thead>
        <tr>
            <th>Name</th>
            <th>Roll_No</th>
            <th>City</th>
        </tr>
        </thead>

        <tr>
            <td>Garv</td>
            <td>210</td>
            <td>Bagasara</td>
        </tr>
        <tr>
            <td>Kremish</td>
            <td>710</td>
            <td>Tori</td>
        </tr>

    </table>
</body>
</html>
