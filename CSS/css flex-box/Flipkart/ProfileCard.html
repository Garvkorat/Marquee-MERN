<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display:flex;
      align-items: center;
      justify-content: center;
      background: #aabdb6;
      font-family: 'Nunito', sans-serif;
    }

    .card {
      width: 300px;
      background: #d3dfd7;
      border-radius: 29px;
      box-shadow: 0 12px 48px rgba(0, 49, 63, 0.13);
      overflow:hidden;
      padding-bottom: 27px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 6px;
    }
    .top-bar button {
      background: none;
      border: none;
      cursor: pointer;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    .top-bar button:hover { background: #f3f4f6; }
    .arrow-icon {
      width: 18px; height: 18px;
      display: block;
    }
    .dots-icon {
      display: flex;
      flex-direction: column;
      gap: 2.5px;
      align-items: center;
    }
    .dots-icon span {
      display: block;
      width: 4px; height: 4px;
      background: #403f3f;
      border-radius: 50%;
    }

    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }
    .avatar-outer {
      position: relative;
      width: 96px; height: 96px;
    }
    .avatar-outer img,
    .avatar-outer .avatar-fallback {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 4px 18px rgba(0,0,0,0.13);
      border: 3px solid #9baba5;
    }
    .avatar-outer .avatar-fallback {
      background: linear-gradient(145deg, #101011, #9ca3af);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      color: #595151;
      line-height: 1;
    }
    /* magnify icon under avatar */
    .magnify {
      position: absolute;
      bottom: -1px; left: 50%;
      transform: translateX(-50%);
      width: 22px; height: 22px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .magnify svg { width: 12px; height: 12px; }

    .profile-name {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: -0.2px;
    }
    .profile-bio {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 500;
      color: #5a5b5d;
      letter-spacing: 0.1px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      padding: 0 24px;
    }
    .soc-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #313030;
      border: 1.5px solid #8ba6dd;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      text-decoration: none;
    }
    .soc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.10);
    }
    .soc-btn svg { width: 20px; height: 20px; display: block; }

    .actions {
      display: flex;
      gap: 10px;
      margin: 20px 22px 0;
    }
    .act-btn {
      flex: 1;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid #c1c2c4;
      background: #b4bebf;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      cursor: pointer;
      letter-spacing: 0.1px;
      transition: background 0.15s, transform 0.13s, box-shadow 0.15s;
    }
    .act-btn:hover {
      background: #6f8d7d;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(1, 1, 1, 0.07);
    }
    .act-btn:active { transform: scale(0.97); }

    .stats {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      margin-top: 22px;
      padding: 0 10px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: default;
    }
    .stat-item svg { width: 18px; height: 18px; }
    .stat-item span {
      font-size: 14px;
      font-weight: 700;
      color: #343e4d;
    }
    .stat-divider {
      width: 1px;
      height: 22px;
      background: #adb1b8;
    }
  </style>
</head>
